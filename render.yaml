services:
  - type: web
    name: NoorStore-SyncEngine
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STORE_URL
        value: https://shafaq-teach.github.io/Noor_Store/
      - key: NODE_ENV
        value: production
